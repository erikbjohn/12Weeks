[pytest]
# S089: the paid live-LLM audit never runs by accident. Opt in with
#   pytest tests/coach_audit --live-coach   (needs ANTHROPIC_API_KEY)
markers =
    live_llm: paid live coach + judge calls (opt-in via --live-coach)
addopts = --ignore=tests/coach_audit -p no:cacheprovider
testpaths = tests
# S157: a RuntimeWarning is a bug (un-awaited coroutine); legacy SQLAlchemy
# and utcnow deprecations are known noise until those sites migrate.
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    ignore::DeprecationWarning
